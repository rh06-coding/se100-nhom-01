name: Kiem moc

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ 'moc/M*' ]

jobs:
  kiem-moc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # can thiet de dem so thanh vien commit

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run kiem_moc.py
        env:
          GITHUB_HEAD_REF: ${{ github.head_ref }}   # de script tu doan moc tu ten nhanh PR
        run: python scripts/kiem_moc.py
